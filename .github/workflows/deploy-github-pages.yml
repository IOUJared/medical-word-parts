name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate data
        run: npm run data:validate
      - name: Test generated data
        run: npm run data:test
      - name: Validate committed browser bundles
        run: npm run browser:validate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Run root development end-to-end tests
        run: npm run test:e2e:dev
      - name: Build
        run: npm run build
      - name: Validate finalized static export
        run: npm run static:validate
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Run production audit
        run: npm run audit:production
      - name: Upload validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: .artifacts
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
