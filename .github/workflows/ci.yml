name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate data
        run: npm run data:validate
      - name: Test generated data
        run: npm run data:test
      - name: Validate committed browser bundles
        run: npm run browser:validate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run root development end-to-end tests
        run: npm run test:e2e:dev
      - name: Build
        run: npm run build
      - name: Validate finalized static export
        run: npm run static:validate
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Run production audit
        run: npm run audit:production
      - name: Upload validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: .artifacts
          if-no-files-found: ignore
